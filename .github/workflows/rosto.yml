name: rosto

# Indexador da busca pelo rosto (v3.2, docs/ROSTO.md). Lê as páginas públicas
# dos álbuns em `vars.ROSTO_SLUGS` e mantém a coleção da Amazon Rekognition
# igual ao que o visitante vê: indexa as fotos novas e apaga os rostos das que
# saíram. Fora do Worker de propósito: indexar estoura os 10 ms de CPU e as 50
# subrequisições do plano grátis.
#
# Sem `vars.ROSTO_SLUGS` (Settings → Secrets and variables → Actions →
# Variables), o job nem começa: nada roda e nada é cobrado.
#
# OS LOGS DESTE WORKFLOW SÃO PÚBLICOS (repositório público). O script só
# imprime contagens: nunca o nome de um álbum ou de um evento, o ID de uma
# foto nem a mensagem crua de um erro. Não acrescente aqui um passo que
# imprima dado do álbum (um `cat` do estado, um `curl -v` do site).
on:
  schedule:
    # A cada 10 min (v3.7.2; o repositório é público, os minutos do Actions
    # não custam): a foto nova entra na busca em até ~10 min mais o período
    # de atualização da galeria. Sem foto nova, a execução leva ~1 min e não
    # chama a Amazon para nada além de listar a coleção. Fora da virada da
    # hora, quando o GitHub atrasa os agendamentos.
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:

permissions:
  contents: read

# Duas execuções ao mesmo tempo indexariam a mesma foto duas vezes.
concurrency:
  group: rosto-indexa
  cancel-in-progress: false

jobs:
  indexa:
    name: Indexa os rostos
    if: vars.ROSTO_SLUGS != ''
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      # O estado (fotos já vistas, inclusive as sem rosto) NÃO fica mais no
      # cache do Actions (v3.8.8): o repositório é público, e o workflow de um
      # pull request vindo de um fork consegue restaurar um cache daqui — o
      # arquivo tinha o ID de toda foto do álbum, inclusive antes do
      # lançamento. O script o guarda no próprio site (/api/busca/estado), com
      # o ROSTO_INDEXADOR_TOKEN. Não recoloque `actions/cache` neste job
      # (tests/rosto-indexador.test.js reprova).
      - name: Indexa
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ROSTO_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ROSTO_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.ROSTO_AWS_REGION || 'sa-east-1' }}
          ROSTO_SLUGS: ${{ vars.ROSTO_SLUGS }}
          ROSTO_INDEXADOR_TOKEN: ${{ secrets.ROSTO_INDEXADOR_TOKEN }}
          # Para de pegar foto nova aos 35 min e grava; o job tem 50.
          ROSTO_MAX_MINUTOS: '35'
        run: node scripts/rosto-indexa.mjs
