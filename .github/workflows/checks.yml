name: checks
on:
  push:
  pull_request:

# O token do workflow nasce com escrita em vários escopos. Nada aqui escreve no
# repositório, então o menor privilégio é leitura — e uma action comprometida na
# cadeia deixa de ter para onde escrever.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # 22+ é exigido pelo wrangler 4 (engines: node >=22). Manter igual ao
          # do deploy.yml: testar numa versão e publicar noutra é justamente o
          # tipo de divergência que este par de workflows existe para evitar.
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      # Checagem de tipos sobre JS puro (checkJs + JSDoc, sem passo de build).
      # Pega a classe de erro que o lint não vê e a suíte só veria por acaso:
      # propriedade digitada errada, argumento a menos, `undefined` escapando.
      - name: Typecheck
        run: npm run typecheck

      # Duas suítes com contratos diferentes, rodadas juntas por `npm test`:
      #   unit    — node, com dublês, rápida
      #   workers — dentro do workerd, com Durable Objects/KV/D1 de verdade
      #
      # A segunda não é redundância. Foi ela que pegou o incremento NÃO ser
      # atômico (100 chamadas simultâneas viravam 3): o dublê da primeira tinha
      # a serialização que nós mesmos escrevemos, então afirmava o que queríamos
      # ouvir. Se um dia esta etapa ficar lenta demais, mova-a para um job
      # próprio — não a remova.
      - name: Tests (unit + workers)
        run: npm test

      # Catraca de cobertura, medida só na suíte `unit`: o provedor v8 depende
      # de `node:inspector`, que não existe no workerd. Os limiares estão no
      # vitest.config.js e são o que a suíte já cobre — se esta etapa falhar,
      # a resposta é escrever o teste que falta, não baixar o número.
      - name: Coverage ratchet
        run: npm run test:coverage

      # O bundle e os bindings do wrangler.toml, verificados SEM credencial
      # nenhuma. `--dry-run` compila, resolve os bindings e sai — então um
      # wrangler.toml quebrado, um binding removido ou um import que não existe
      # reprovam aqui, no PR, em vez de na primeira tentativa de publicar.
      # Antes disso, o deploy.yml era o primeiro lugar onde qualquer erro de
      # empacotamento aparecia, e ele só roda depois do merge.
      - name: Bundle compila e os bindings resolvem (dry-run)
        run: |
          set -e
          npx wrangler versions upload --env= --dry-run --outdir /tmp/bundle-check | tee /tmp/dry.log
          # Um binding que suma do wrangler.toml não quebra o build — só some,
          # e o Worker passa a receber `undefined` em produção. A lista é curta
          # e a ausência é silenciosa, então cada um é conferido pelo nome.
          for b in COUNTER RATELIMIT FOTOS CONSENT_DB; do
            grep -q "env\.$b" /tmp/dry.log || { echo "FALHA: binding $b sumiu do wrangler.toml"; exit 1; }
          done
          echo "OK: bundle compila e os 4 bindings resolvem."

      # O smoke virou script de verdade (scripts/smoke.sh), então passa a ter as
      # mesmas exigências de qualquer código do repositório: precisa ao menos
      # ser sintaticamente válido antes de alguém depender dele num deploy.
      #
      # E o shell dos WORKFLOWS entra junto. Ele era o único código executável
      # do repositório sem verificação nenhuma — e foi exatamente ali que um
      # defeito passou: no deploy.yml, um `grep` sem correspondência combinado
      # com `pipefail` e o `bash -e` do runner matava o step antes das próprias
      # mensagens de erro. Um bloco `run:` é código; recebe o mesmo tratamento.
      - name: Sintaxe do shell (scripts e workflows)
        run: |
          set -e
          for f in scripts/*.sh; do bash -n "$f" && echo "OK $f"; done
          python3 -c 'import yaml' 2>/dev/null || pip install --quiet pyyaml
          python3 scripts/verifica-shell-dos-workflows.py

      - name: Validate JSON files
        run: |
          set -e
          find . -name '*.json' -not -path '*/node_modules/*' -not -path './.git/*' | while read -r f; do
            python3 -m json.tool "$f" > /dev/null || { echo "Invalid JSON: $f"; exit 1; }
          done

      - name: Forbid weak HTML escapers (must also escape quotes)
        run: |
          if grep -rnE --include='*.html' --include='*.js' --exclude-dir=node_modules --exclude-dir=.git "replace\(/>/g, ?'&gt;'\) *[;)]" .; then
            echo "Found a 3-char HTML escaper - use the canonical 5-char version that also escapes quotes"
            exit 1
          fi

      - name: JS module syntax check (src)
        run: |
          node -e '
            const files = process.argv.slice(1);
            (async () => {
              for (const f of files) {
                try { await import(process.cwd() + "/" + f); console.log("OK", f); }
                catch (e) {
                  if (e instanceof SyntaxError) { console.error("SYNTAX FAIL", f, e.message); process.exit(1); }
                  console.log("OK (runtime-only error)", f);
                }
              }
            })();
          ' $(find src -name "*.js")
