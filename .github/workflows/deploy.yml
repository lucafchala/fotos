name: Deploy

# ---------------------------------------------------------------------------
# Onde a versão é verificada: no PR (prévia) e, em produção, com reversão
# ---------------------------------------------------------------------------
# Merge na `main` é deploy. Por isso a verificação de uma mudança acontece ANTES
# do merge, na prévia do PR (Cloudflare Worker Previews, `[previews]` do
# wrangler.toml): o Workers Builds publica cada PR com `npm run previa` e posta
# o endereço no próprio PR. Lá se confere o que o smoke não confere — painel,
# fluxos com e-mail, galeria (README, "Prévia de PR"; docs/RELEASE.md).
#
# Este workflow cuida do resto, e em ordem:
#   1. `versions upload` publica a versão SEM ROTEAR TRÁFEGO (com `--tag <sha>`).
#   2. `versions deploy <id>@100` manda 100% do tráfego para ESSA versão — o
#      artefato idêntico, não uma recompilação.
#   3. `scripts/smoke.sh` confere produção (~55 checagens) e, se reprovar,
#      `wrangler rollback` volta sozinho para a versão anotada antes da
#      promoção. A exposição é de segundos, não zero — é o preço de não haver
#      verificação anterior à promoção neste Worker (abaixo).
#   4. Rollback manual é promover uma versão anterior (input `version_id`), sem
#      recompilar e sem mexer no Git.
#
# POR QUE NÃO HÁ SMOKE ANTES DA PROMOÇÃO (#179). Existiu um portão assim: o
# smoke rodava contra a URL de preview da versão recém-enviada. Ela NUNCA veio:
# o `versions upload` volta com `metadata.has_preview = false` (decidido pelo
# servidor; `previews_enabled` estava `true`) e a URL derivada do ID responde
# 404. A causa provável é este Worker implementar Durable Objects, que a
# Cloudflare não serve em Preview URLs de versão (a confirmar no #179). Em
# três execuções reais não houve flag que resolvesse, e o portão virou
# "oportunista": 60 s de espera inútil, um passo que mexia na configuração do
# Worker pela API e um resumo que dizia "indisponível" em todo deploy. Saiu.
#
# POR QUE NÃO `wrangler preview` AQUI. É o mecanismo de Worker Previews, que
# funciona com Durable Objects, mas não serve de portão da promoção: sobe OUTRO
# artefato (com os bindings de `[previews]`, `AMBIENTE = "previa"`, Turnstile de
# teste e KV/D1 próprios), então o smoke de produção reprovaria nele por
# desenho (o login sem token passa pelo Turnstile de teste) e, se passasse, não
# provaria nada sobre a versão que vai receber tráfego. Faria falta um smoke
# próprio de prévia e segredos PREVIA_* no GitHub; o PR já tem a prévia.
#
# ⚠️ LIMITE CONHECIDO — migração de Durable Object.
# `versions upload` NÃO aplica migração de DO: a API recusa com o código 10211
# ("migrations must be fully applied via a non-versioned deployment"). Enquanto
# `[[migrations]]` do wrangler.toml tiver só a tag `v1` (já aplicada), nada
# acontece. No dia em que entrar uma `v2`, este workflow FALHA no upload — de
# propósito, com a mensagem explicando — e o caminho é disparar manualmente com
# `unversioned: true`, que usa `wrangler deploy` e publica direto, sem passar
# por versão sem tráfego (o smoke e a reversão automática continuam valendo).
# Falhar alto é melhor que pular a verificação em silêncio.

on:
  push:
    branches: [main]

  # Disparo manual (funciona do celular). Serve para o que não tem commit:
  # rotação de secret, rollback, e reverificar produção depois de mexer em algo
  # fora do repositório (binding de KV, domínio, painel da Cloudflare).
  workflow_dispatch:
    inputs:
      promote:
        description: 'Promover para produção. Desligado = só sobe a versão, sem tráfego e sem smoke (promova depois com version_id).'
        type: boolean
        default: true
      version_id:
        description: 'Promover uma versão JÁ EXISTENTE (rollback). Vazio = compila a partir deste commit.'
        type: string
        default: ''
      unversioned:
        description: 'Usar wrangler deploy (publica direto, sem versão sem tráfego). Só para migração de Durable Object — ver 10211.'
        type: boolean
        default: false

# `contents: write` só por causa da tag de release criada no fim. O deploy em si
# fala com a Cloudflare por API token próprio, não pelo token do GitHub.
permissions:
  contents: write

# Dois pushes em sequência não podem promover versões fora de ordem. Sem
# cancel-in-progress: cancelar um deploy no meio da promoção deixaria tráfego
# dividido entre duas versões.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # Um push publica uma vez só (#186). O GitHub já entregou o mesmo push duas
  # vezes (165 e 166, para o merge do #184), e a segunda execução republicou o
  # commit. Esta conferência decide se o `deploy` roda. Ela fica num job à
  # parte para o `deploy` inteiro virar "skipped", sem migração, upload, tag
  # nem release, em vez de um `if:` em cada passo. A regra e o porquê estão em
  # scripts/deploy-duplicado.mjs.
  duplicado:
    name: Commit já publicado?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read   # checkout do script
      actions: read    # listar as execuções deste workflow
    outputs:
      pular: ${{ steps.confere.outputs.pular }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Conferir execuções anteriores deste commit
        id: confere
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/deploy-duplicado.mjs

  deploy:
    needs: duplicado
    # `!cancelled()` no lugar do `success()` implícito: se a própria
    # conferência quebrar, o deploy segue (falha aberta, como o script faz
    # quando a API não responde). Só um `pular=true` explícito o segura.
    if: ${{ !cancelled() && needs.duplicado.outputs.pular != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WORKER_NAME: fotos
      # --env="": o topo do wrangler.toml, nunca um `[env.*]`. Hoje não há
      # nenhum (o `[env.preview]`, que apontava para o KV de produção, saiu no
      # #166), e o flag vazio equivale a não passar nada. Fica por ser
      # explícito: se alguém declarar um ambiente, a produção não muda de alvo
      # por acidente — e tirá-lo mexeria nos comandos de reversão, que só
      # rodam quando algo já deu errado.
      WRANGLER_ENV_FLAG: '--env='
      # ID de versão da Cloudflare: UUID inteiro, conferido por UMA regra só —
      # vale para o que sai do upload, do `deployments status` e do
      # `version_id` digitado à mão num rollback (#164). Use sempre como
      # `[[ "$X" =~ ${UUID_RE:?} ]]`. O `:?` derruba o passo se a variável
      # sumir (regex vazia casa com tudo). E `[[ =~ ]]`, não `grep`: o grep
      # confere LINHA a linha, e um valor de duas linhas com um UUID na
      # primeira passaria — a segunda iria parar no $GITHUB_OUTPUT.
      UUID_RE: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
    steps:
      - uses: actions/checkout@v7
        with:
          # Histórico completo: a tag de release no fim precisa enxergar as
          # tags que já existem para não recriar uma.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # 22+ é exigido pelo wrangler 4 (engines: node >=22). No Node 20 o
          # binário recusa a rodar antes de qualquer comando.
          node-version: '22'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # A versão que vai para a Cloudflare é a que o `npm ci` ACABOU de
      # instalar, lida de node_modules — não um número mantido à mão num
      # segundo lugar, que foi como `4.114.0` aqui divergiu de `^4.125.0` no
      # package.json sem ninguém ver.
      - name: Derivar a versão do wrangler
        run: |
          set -e
          V=$(node -p "require('./node_modules/wrangler/package.json').version")
          case "$V" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "FALHA: versão do wrangler inesperada: '$V'"; exit 1 ;;
          esac
          echo "Wrangler resolvido pelo npm ci: $V"
          echo "WRANGLER_VERSION=$V" >> "$GITHUB_ENV"

      # Portão pré-deploy COMPLETO, não só `npm test`: o lint e o typecheck já
      # pegaram defeito que a suíte não pega (crase solta fechando um template
      # literal, propriedade digitada errada). Rodavam só no checks.yml, que não
      # roda em push na main — ou seja, um merge direto passava sem eles.
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Testes (unit + workers)
        run: npm test

      # Schema ANTES do código novo servir qualquer requisição: o smoke de
      # produção roda logo após a promoção, e um INSERT de consentimento numa
      # coluna que ainda não existe falharia ali.
      #
      # Era `continue-on-error: true` com `wrangler d1 migrations apply` direto.
      # O primeiro deploy real mostrou o custo disso: o passo vinha falhando com
      # `duplicate column name: access_type` em TODO deploy desde 09/08, e o
      # `continue-on-error` engolia a diferença entre "a coluna já estava lá" e
      # "o esquema não tem a coluna que o código escreve" — que é a diferença
      # entre irrelevante e grave. Ver scripts/d1-migrate.mjs.
      #
      # Agora são três desfechos, não dois:
      #   0   esquema no lugar          -> segue
      #   75  indeterminado (rede/API)  -> segue com aviso; entregar foto não
      #                                    pode depender do log de consentimento
      #   1   esquema QUEBRADO          -> PARA. Promover código que escreve numa
      #                                    tabela incompleta perde o registro de
      #                                    consentimento em silêncio, e ele é
      #                                    prova de autorização de uso de imagem.
      - name: Migrações D1
        id: migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          node scripts/d1-migrate.mjs fotos-consent migrations
          CODIGO=$?
          set -e
          case "$CODIGO" in
            0)
              echo "estado=ok" >> "$GITHUB_OUTPUT" ;;
            75)
              echo "estado=indeterminado" >> "$GITHUB_OUTPUT"
              echo "::warning::Não deu para confirmar o esquema do D1. O deploy segue — confira o log deste passo." ;;
            *)
              echo "estado=quebrado" >> "$GITHUB_OUTPUT"
              echo "::error::O esquema do D1 não está no estado que o código espera. Deploy interrompido antes de qualquer promoção."
              exit 1 ;;
          esac

      # ---------------------------------------------------------------------
      # Caminho de escape: deploy não-versionado (só migração de DO)
      # ---------------------------------------------------------------------
      - name: Deploy não-versionado (direto, sem versão sem tráfego)
        id: unversioned
        if: inputs.unversioned
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          command: deploy --env=

      - name: Avisar que o deploy foi não-versionado
        if: inputs.unversioned
        run: |
          {
            echo "### ⚠️ Deploy não-versionado"
            echo
            echo "Publicado direto em produção com \`wrangler deploy\`, o que só se"
            echo "justifica para aplicar migração de Durable Object (erro 10211)."
            echo "**O smoke roda depois da publicação** (e reverte sozinho se reprovar)."
          } >> "$GITHUB_STEP_SUMMARY"

      # ---------------------------------------------------------------------
      # Caminho normal: sobe a versão SEM rotear tráfego
      # ---------------------------------------------------------------------
      # A versão é etiquetada com o SHA do commit. É o que permite achá-la
      # depois por `versions list --json` sem depender de parsear o stdout do
      # upload, e é o que faz "qual commit está em produção?" ter resposta na
      # própria Cloudflare, não só no Git.
      - name: Subir versão (sem tráfego)
        id: upload
        if: ${{ !inputs.unversioned && inputs.version_id == '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          SHORT_SHA="${GITHUB_SHA::7}"
          SAIDA=$(mktemp)
          if ! npx --yes wrangler@"$WRANGLER_VERSION" versions upload \
                 "$WRANGLER_ENV_FLAG" \
                 --tag "$SHORT_SHA" \
                 --message "$(git log -1 --pretty=%s | head -c 100)" 2>&1 | tee "$SAIDA"; then
            if grep -q '10211' "$SAIDA"; then
              echo "::error::Migração de Durable Object pendente: 'versions upload' não a aplica (10211)."
              echo "::error::Redispare este workflow manualmente com 'unversioned: true' — ele publica direto com 'wrangler deploy', sem passar por versão sem tráfego."
            fi
            exit 1
          fi

          # O ID da versão sai do próprio upload — a linha `Worker Version ID:`
          # que o wrangler imprime depois de `Uploaded fotos`. É o MESMO
          # identificador que `versions deploy <id>@100` aceita.
          #
          # UUID conferido por inteiro, não por "parece um UUID": este valor vai
          # direto para uma promoção.
          ID=$(sed -n 's/^[[:space:]]*Worker Version ID:[[:space:]]*//p' "$SAIDA" | head -1 | tr -d '[:space:]' || true)
          if [[ "$ID" =~ ${UUID_RE:?} ]]; then
            echo "version_id=$ID" >> "$GITHUB_OUTPUT"
            echo "Versão: $ID"
          else
            echo "A linha 'Worker Version ID' não trouxe um UUID (veio: '$ID'). O passo seguinte resolve pela etiqueta."
          fi
          echo "version_tag=$SHORT_SHA" >> "$GITHUB_OUTPUT"

      # Resolve a etiqueta para o ID pela API, e não por regex no stdout: o ID
      # é o que `versions deploy` aceita, e `versions list --json` é contrato
      # estável (`--json` é flag documentada), diferente do texto do upload.
      - name: Resolver o ID da versão
        id: resolve
        if: ${{ !inputs.unversioned }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # O input entra por variável de ambiente, nunca como `${{ }}` dentro
          # do script (#164): a expressão é colada no TEXTO do shell antes de
          # ele rodar, e um valor com aspas e `;` viraria comando num job que
          # carrega o token da Cloudflare e `contents: write`. Quem dispara já
          # tem escrita no repositório — o risco é o typo e o link colado de
          # fonte duvidosa, não um estranho. scripts/verifica-shell-dos-workflows.py
          # recusa `${{ inputs.* }}` em qualquer `run:`.
          VERSION_ID_MANUAL: ${{ inputs.version_id }}
        run: |
          set -eo pipefail
          if [ -n "$VERSION_ID_MANUAL" ]; then
            # Conferido antes de virar output: daqui ele vai para
            # `versions deploy`, para a mensagem da tag e para o resumo.
            # O valor recusado NÃO é ecoado — texto arbitrário no log pode
            # carregar comando de workflow (`::…::`); ele já aparece nos
            # inputs da execução.
            if ! [[ "$VERSION_ID_MANUAL" =~ ${UUID_RE:?} ]]; then
              echo "::error::version_id não é um ID de versão (UUID como 0e65efc8-c701-47b1-9b50-21108d826fce). Copie o ID do resumo de um deploy anterior ou de 'wrangler versions list'."
              exit 1
            fi
            echo "version_id=$VERSION_ID_MANUAL" >> "$GITHUB_OUTPUT"
            echo "Promovendo versão informada à mão (rollback): $VERSION_ID_MANUAL"
            exit 0
          fi
          # Caminho normal: o upload já disse qual é o ID. Nada a resolver.
          if [ -n "${{ steps.upload.outputs.version_id }}" ]; then
            echo "version_id=${{ steps.upload.outputs.version_id }}" >> "$GITHUB_OUTPUT"
            echo "ID veio do próprio upload: ${{ steps.upload.outputs.version_id }}"
            exit 0
          fi
          # Reserva: o wrangler mudou o texto do upload. Procura pela etiqueta.
          TAG="${{ steps.upload.outputs.version_tag }}"
          npx --yes wrangler@"$WRANGLER_VERSION" versions list "$WRANGLER_ENV_FLAG" --json > versoes.json
          # A etiqueta aparece em `annotations["workers/tag"]` na API atual, mas
          # este é o único ponto do workflow que depende de um FORMATO de
          # resposta, e não de um flag documentado. Então: tenta as formas
          # conhecidas e, se nenhuma casar, MORRE mostrando o que veio — nunca
          # cai para "a mais recente", que promoveria uma versão que ninguém
          # verificou e desfaria a rastreabilidade do deploy em silêncio.
          ID=$(node -e '
            const v = require("./versoes.json");
            const alvo = process.argv[1];
            const lista = Array.isArray(v) ? v : (v && Array.isArray(v.versions) ? v.versions : []);
            const etiqueta = x => (x && x.annotations && x.annotations["workers/tag"]) || (x && x.tag) || null;
            const achada = lista.find(x => etiqueta(x) === alvo);
            if (achada && achada.id) { console.log(achada.id); process.exit(0); }
            console.error("Nenhuma versão com a etiqueta " + JSON.stringify(alvo) + ".");
            console.error("Etiquetas vistas: " + JSON.stringify(lista.slice(0, 5).map(etiqueta)));
            console.error("Chaves do primeiro item: " + JSON.stringify(Object.keys(lista[0] || {})));
            process.exit(1);' "$TAG")
          if [ -z "$ID" ]; then
            echo "::error::Não consegui resolver o ID da versão recém-enviada — veja as chaves impressas acima e ajuste o resolvedor."
            exit 1
          fi
          echo "version_id=$ID" >> "$GITHUB_OUTPUT"
          echo "Versão $ID etiquetada como $TAG"

      # ---------------------------------------------------------------------
      # Rede de segurança: para onde voltar se a promoção der errado
      # ---------------------------------------------------------------------
      # Lido ANTES de promover, porque depois já é tarde: é a versão que está
      # servindo clientes neste instante. `wrangler rollback` sem argumento
      # volta para a anterior sozinho, mas passar o ID explícito é preferível —
      # reverter é mexer no que o cliente vê, e "a anterior" é implícito demais
      # para essa decisão.
      #
      # Não falha o deploy se não conseguir: sem ID a reversão cai no modo
      # implícito, que ainda funciona. Um passo de segurança que derruba o
      # deploy quando não consegue se preparar seria pior que o risco que cobre.
      - name: Anotar a versão que está em produção
        id: anterior
        if: ${{ inputs.unversioned || github.event_name == 'push' || inputs.promote }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -uo pipefail
          BRUTO=$(npx --yes wrangler@"$WRANGLER_VERSION" deployments status \
                    "$WRANGLER_ENV_FLAG" --json 2>/dev/null || true)
          ID=$(printf '%s' "$BRUTO" | node -e '
            let b = "";
            process.stdin.on("data", d => b += d).on("end", () => {
              try {
                const i = b.search(/[[{]/);
                const r = JSON.parse(b.slice(i < 0 ? 0 : i));
                const v = (r.versions || r.result?.versions || [])[0];
                console.log(v?.version_id || v?.id || r.version_id || "");
              } catch { console.log(""); }
            });' || true)
          if [[ "$ID" =~ ${UUID_RE:?} ]]; then
            echo "version_id=$ID" >> "$GITHUB_OUTPUT"
            echo "Em produção agora: $ID (alvo de reversão)"
          else
            echo "::warning::Não consegui ler a versão atual; uma reversão usaria o modo implícito de 'wrangler rollback'."
          fi

      # ---------------------------------------------------------------------
      # Promoção: 100% do tráfego para a MESMA versão que passou no smoke
      # ---------------------------------------------------------------------
      - name: Promover para produção
        id: promote
        if: ${{ !inputs.unversioned && (github.event_name == 'push' || inputs.promote) }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -eo pipefail
          ID="${{ steps.resolve.outputs.version_id }}"
          npx --yes wrangler@"$WRANGLER_VERSION" versions deploy "$ID@100" \
            "$WRANGLER_ENV_FLAG" --yes \
            --message "CI $GITHUB_RUN_ID — $(git log -1 --pretty=%s | head -c 80)"
          echo "promoted=true" >> "$GITHUB_OUTPUT"

      # `sleep 20` era um chute: curto demais numa propagação lenta (falso
      # vermelho) e desperdício quando já estava pronto. Isto espera pelo SINAL,
      # e o número de tentativas fica registrado.
      - name: Esperar a propagação (por sinal, não por relógio)
        id: readiness
        if: ${{ steps.promote.outputs.promoted == 'true' || inputs.unversioned }}
        run: |
          BASE="https://${WORKER_NAME}.lucafchala.workers.dev"
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$BASE/api/healthz" || true)
            if [ "$CODE" = "200" ]; then
              echo "pronto após ${i} tentativa(s)"
              echo "tentativas=$i" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 2
          done
          echo "::error::healthz não respondeu 200 em ~60s após a promoção"
          exit 1

      # `continue-on-error` aqui NÃO é tolerância: é o que permite ao passo
      # seguinte reagir. O job fica vermelho de qualquer jeito — ou porque a
      # reversão aconteceu (e ela mesma sai com erro), ou porque não havia o que
      # reverter. Sem isto o job morreria aqui e produção ficaria com a versão
      # ruim servindo, que é exatamente o que este trabalho existe para acabar.
      - name: Smoke de PRODUÇÃO (confirma a promoção)
        id: smoke_prod
        continue-on-error: true
        if: ${{ steps.promote.outputs.promoted == 'true' || inputs.unversioned }}
        run: |
          echo "### ✅ Smoke de produção" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          # workers.dev e não o domínio de produção: a zona fotos.lucafchala.com
          # fica atrás do bot mitigation da Cloudflare, que responde 403 a
          # cliente não-browser como o curl. É o MESMO Worker.
          bash scripts/smoke.sh "https://${WORKER_NAME}.lucafchala.workers.dev" \
            --expect-configured --summary "$GITHUB_STEP_SUMMARY"

      # ---------------------------------------------------------------------
      # Reversão automática: a rede de segurança da promoção
      # ---------------------------------------------------------------------
      # O fluxo anterior a este trabalho publicava e rodava o smoke depois; um
      # smoke vermelho marcava o deploy como falho e ia embora, deixando a
      # versão ruim servindo até alguém perceber e agir. Este passo fecha esse
      # buraco: reprovou, volta — em segundos, sem depender de ninguém.
      #
      # Só roda com promoção confirmada: sem promoção não há o que reverter, e
      # reverter "por via das dúvidas" mexeria no que o cliente vê sem motivo.
      - name: Reverter automaticamente se produção reprovou
        id: reversao
        if: ${{ steps.smoke_prod.outcome == 'failure' && (steps.promote.outputs.promoted == 'true' || inputs.unversioned) }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -uo pipefail
          ALVO="${{ steps.anterior.outputs.version_id }}"
          echo "::error::O smoke de produção reprovou. Revertendo."

          # `|| REV=$?` e não `REV=$?` depois do `fi`: o runner executa este bloco
          # com `bash -e`, então um rollback que falhasse mataria o step ANTES
          # da atribuição — e antes das mensagens escritas exatamente para esse
          # caso. É a armadilha registrada no TODO.md, e ela quase entrou de
          # novo aqui, no passo onde silêncio custaria mais caro: produção
          # servindo código reprovado, sem ninguém avisado.
          REV=0
          if [ -n "$ALVO" ]; then
            echo "Revertendo para $ALVO"
            npx --yes wrangler@"$WRANGLER_VERSION" rollback "$ALVO" \
              "$WRANGLER_ENV_FLAG" --yes \
              --message "Reversão automática: smoke de produção reprovou (run $GITHUB_RUN_ID)" || REV=$?
          else
            echo "Sem ID anotado; revertendo para a versão anterior (modo implícito)."
            npx --yes wrangler@"$WRANGLER_VERSION" rollback \
              "$WRANGLER_ENV_FLAG" --yes \
              --message "Reversão automática: smoke de produção reprovou (run $GITHUB_RUN_ID)" || REV=$?
          fi

          if [ "$REV" -ne 0 ]; then
            echo "::error::A REVERSÃO FALHOU. Produção pode estar servindo código que reprovou no smoke."
            echo "::error::Aja à mão: Actions → Deploy → Run workflow com version_id = ${ALVO:-<uma versão boa>}."
            echo "revertido=falhou" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          # Reverter não basta: é preciso ver o site de pé de novo. Uma reversão
          # que não restaura é indistinguível de nenhuma reversão.
          BASE="https://${WORKER_NAME}.lucafchala.workers.dev"
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$BASE/api/healthz" || true)
            if [ "$CODE" = "200" ]; then
              echo "Produção respondendo de novo após ${i} tentativa(s)."
              echo "revertido=sim" >> "$GITHUB_OUTPUT"
              echo "::error::Revertido com sucesso. O commit NÃO está em produção — corrija e envie de novo."
              exit 1
            fi
            sleep 2
          done
          echo "::error::Revertido, mas o healthz não voltou a 200 em ~60s. CONFIRA O SITE À MÃO."
          echo "revertido=sem-confirmacao" >> "$GITHUB_OUTPUT"
          exit 1

      # ---------------------------------------------------------------------
      # Rastreabilidade: a tag deixa de ser ação manual
      # ---------------------------------------------------------------------
      # O TODO.md pedia "marcar releases com tag para que rollback seja um SHA
      # conhecido em vez de arqueologia no log", e o repositório não tinha
      # nenhuma — porque dependia de alguém lembrar. Agora é consequência
      # automática de um deploy que passou nos dois smokes.
      # `smoke_prod.outcome == 'success'` é novo e importante: antes, o passo de
      # smoke falhando matava o job e a tag simplesmente não acontecia. Agora
      # que o smoke é `continue-on-error`, a condição precisa ser explícita —
      # senão o repositório ganharia uma tag `deploy-…` apontando para um commit
      # que reprovou e foi revertido.
      - name: Marcar o release
        id: tag
        if: ${{ steps.promote.outputs.promoted == 'true' && github.event_name == 'push' && steps.smoke_prod.outcome == 'success' }}
        run: |
          set -e
          # Lido ANTES de criar a tag nova: depois disso `git tag -l` já
          # incluiria ela e "a anterior" apontaria para si mesma.
          PREV_TAG=$(git tag -l 'deploy-*' | sort | tail -1 || true)
          TAG="deploy-$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Deploy verificado — versão ${{ steps.resolve.outputs.version_id }}"
          git push origin "$TAG"
          echo "TAG_CRIADA=$TAG" >> "$GITHUB_ENV"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prev_tag=$PREV_TAG" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------------------
      # GitHub Release: o mesmo evento verificado vira um registro navegável
      # (changelog automático — commits desde a tag anterior —, sem curadoria
      # manual), não só uma tag no histórico do Git.
      #
      # `continue-on-error: true` aqui É tolerância de verdade, ao contrário
      # do uso no smoke de produção acima: esta chamada não tem efeito
      # colateral em produção nenhum, então uma falha dela não pode marcar
      # vermelho um deploy que já publicou e passou nos dois smokes — mas
      # "best-effort" só vale quando o passo AVISA que falhou
      # (`::warning::` + a resposta da API no log), nunca quando engole a
      # diferença em silêncio (ver TODO.md, "Regras vivas" → "Passo
      # best-effort é passo que ninguém lê").
      #
      # `if` depende só do output da tag, não repete a condição inteira: se
      # o passo anterior não chegou a criar/empurrar a tag (por `set -e`),
      # `steps.tag.outputs.tag` fica vazio e este passo é pulado sozinho.
      - name: Criar GitHub Release
        id: release
        if: ${{ steps.tag.outputs.tag != '' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          PREV_TAG: ${{ steps.tag.outputs.prev_tag }}
          VERSION_ID: ${{ steps.resolve.outputs.version_id }}
        run: |
          set -uo pipefail
          if [ -n "$PREV_TAG" ]; then
            CHANGELOG=$(git log --pretty='- %s (%h)' "${PREV_TAG}..HEAD")
          else
            CHANGELOG=$(git log --pretty='- %s (%h)' -20)
          fi
          BODY=$(printf 'Versão verificada pelo smoke test e promovida para 100%% do tráfego.\n\nVersão Cloudflare: `%s`\n\n### Commits\n\n%s\n' \
                   "$VERSION_ID" "$CHANGELOG")
          PAYLOAD=$(jq -n --arg tag "$TAG" --arg body "$BODY" \
            '{tag_name: $tag, name: $tag, body: $body, draft: false, prerelease: false}')
          HTTP_CODE=$(curl -s -o resposta.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/releases" \
            -d "$PAYLOAD")
          if [ "$HTTP_CODE" != "201" ]; then
            echo "::warning::Não foi possível criar a GitHub Release para $TAG (HTTP $HTTP_CODE). A tag já existe e o deploy NÃO é afetado — só o registro navegável no GitHub."
            cat resposta.json
            exit 1
          fi
          echo "Release criada: $TAG"

      # ---------------------------------------------------------------------
      # Observabilidade: o resumo responde "o que foi para produção, e passou?"
      # sem abrir log de step nenhum.
      # ---------------------------------------------------------------------
      - name: Resumo do deploy
        if: always()
        env:
          UNVERSIONED: ${{ inputs.unversioned }}
        run: |
          {
            echo "## Deploy"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Commit | \`${GITHUB_SHA::7}\` — $(git log -1 --pretty=%s | head -c 70) |"
            echo "| Disparo | \`${{ github.event_name }}\` |"
            echo "| Wrangler | \`${WRANGLER_VERSION:-?}\` |"
            echo "| Versão | \`${{ steps.resolve.outputs.version_id || '—' }}\` |"
            echo "| Promovido | ${{ steps.promote.outputs.promoted == 'true' && '✅ 100% do tráfego' || '⏸️ não (só enviada, sem tráfego)' }} |"
            echo "| Propagação | ${{ steps.readiness.outputs.tentativas && format('{0} tentativa(s)', steps.readiness.outputs.tentativas) || '—' }} |"
            echo "| Migrações D1 | ${{ steps.migrations.outputs.estado == 'ok' && '✅ esquema no lugar' || (steps.migrations.outputs.estado == 'indeterminado' && '⚠️ indeterminado (deploy seguiu)' || '❌ esquema quebrado') }} |"
            echo "| Smoke de produção | ${{ steps.smoke_prod.outcome == 'success' && '✅ passou' || (steps.smoke_prod.outcome == 'failure' && '❌ reprovou' || '—') }} |"
            echo "| Reversão | ${{ steps.reversao.outputs.revertido == 'sim' && '🔙 revertido — o commit NÃO está em produção' || (steps.reversao.outputs.revertido && '🚨 reversão com problema — confira o site' || '—') }} |"
            echo "| Tag | \`${TAG_CRIADA:-—}\` |"
            echo "| Release | ${{ steps.release.outcome == 'success' && format('✅ https://github.com/{0}/releases/tag/{1}', github.repository, steps.tag.outputs.tag) || (steps.release.outcome == 'failure' && '⚠️ tag criada, Release falhou — ver log do passo' || '—') }} |"
            echo
            if [ "${{ steps.promote.outputs.promoted }}" != "true" ] && [ "$UNVERSIONED" != "true" ]; then
              echo "> A versão foi enviada à Cloudflare, mas **não** recebeu tráfego nem smoke."
              echo "> Para promovê-la: rode este workflow com \`version_id\` = \`${{ steps.resolve.outputs.version_id }}\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
