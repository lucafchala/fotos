name: Deploy

# ---------------------------------------------------------------------------
# O portão que faltava: a versão é VERIFICADA antes de qualquer cliente vê-la
# ---------------------------------------------------------------------------
# Como era: `wrangler deploy` publicava direto em produção e o smoke test rodava
# DEPOIS. O próprio README admitia a consequência — "qualquer falha no smoke
# test marca o deploy como vermelho mas o Worker já foi publicado, então um
# deploy vermelho ainda alterou produção". Todo deploy era um incidente em
# potencial, e o teste que existia para dizer "está bom" só rodava quando já
# não dava para mudar de ideia.
#
# Como é: `versions upload` publica a versão SEM ROTEAR TRÁFEGO. Ela ganha uma
# URL de preview própria, o smoke test roda contra ELA, e só então
# `versions deploy` manda 100% do tráfego para essa mesma versão — o artefato
# idêntico, não uma recompilação. Se o smoke reprovar, produção nunca soube que
# existiu uma versão nova.
#
# O que isso compra, na ordem em que importa:
#   1. Cliente nenhum vê código que não passou pelo smoke.
#   2. Rollback vira promover uma versão anterior (input `version_id`), sem
#      recompilar e sem mexer no Git.
#   3. O mesmo `scripts/smoke.sh` roda local (`wrangler dev`), no preview e em
#      produção — "passou no preview" quer dizer exatamente o mesmo que
#      "passou em produção".
#
# ⚠️ LIMITE CONHECIDO — migração de Durable Object.
# `versions upload` NÃO aplica migração de DO: a API recusa com o código 10211
# ("migrations must be fully applied via a non-versioned deployment"). Enquanto
# `[[migrations]]` do wrangler.toml tiver só a tag `v1` (já aplicada), nada
# acontece. No dia em que entrar uma `v2`, este workflow FALHA no upload — de
# propósito, com a mensagem explicando — e o caminho é disparar manualmente com
# `unversioned: true`, que usa `wrangler deploy` e ABRE MÃO do portão de preview
# naquele deploy. Falhar alto é melhor que pular a verificação em silêncio.

on:
  push:
    branches: [main]

  # Disparo manual (funciona do celular). Serve para o que não tem commit:
  # rotação de secret, rollback, e reverificar produção depois de mexer em algo
  # fora do repositório (binding de KV, domínio, painel da Cloudflare).
  workflow_dispatch:
    inputs:
      promote:
        description: 'Promover para produção depois do smoke do preview'
        type: boolean
        default: true
      version_id:
        description: 'Promover uma versão JÁ EXISTENTE (rollback). Vazio = compila a partir deste commit.'
        type: string
        default: ''
      unversioned:
        description: 'Usar wrangler deploy (sem portão de preview). Só para migração de Durable Object — ver 10211.'
        type: boolean
        default: false

# `contents: write` só por causa da tag de release criada no fim. O deploy em si
# fala com a Cloudflare por API token próprio, não pelo token do GitHub.
permissions:
  contents: write

# Dois pushes em sequência não podem promover versões fora de ordem. Sem
# cancel-in-progress: cancelar um deploy no meio da promoção deixaria tráfego
# dividido entre duas versões.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WORKER_NAME: fotos
      # --env="": o wrangler.toml declara `[env.preview]`, e sem o flag o CLI
      # avisa que o ambiente-alvo é ambíguo. Explícito não depende de qual é o
      # default da versão do wrangler instalada.
      WRANGLER_ENV_FLAG: '--env='
    steps:
      - uses: actions/checkout@v7
        with:
          # Histórico completo: a tag de release no fim precisa enxergar as
          # tags que já existem para não recriar uma.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # 22+ é exigido pelo wrangler 4 (engines: node >=22). No Node 20 o
          # binário recusa a rodar antes de qualquer comando.
          node-version: '22'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # A versão que vai para a Cloudflare é a que o `npm ci` ACABOU de
      # instalar, lida de node_modules — não um número mantido à mão num
      # segundo lugar, que foi como `4.114.0` aqui divergiu de `^4.125.0` no
      # package.json sem ninguém ver.
      - name: Derivar a versão do wrangler
        run: |
          set -e
          V=$(node -p "require('./node_modules/wrangler/package.json').version")
          case "$V" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "FALHA: versão do wrangler inesperada: '$V'"; exit 1 ;;
          esac
          echo "Wrangler resolvido pelo npm ci: $V"
          echo "WRANGLER_VERSION=$V" >> "$GITHUB_ENV"

      # Portão pré-deploy COMPLETO, não só `npm test`: o lint e o typecheck já
      # pegaram defeito que a suíte não pega (crase solta fechando um template
      # literal, propriedade digitada errada). Rodavam só no checks.yml, que não
      # roda em push na main — ou seja, um merge direto passava sem eles.
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Testes (unit + workers)
        run: npm test

      # Schema ANTES do código novo servir qualquer requisição, inclusive na URL
      # de preview: o smoke roda contra o preview, e um INSERT de consentimento
      # numa coluna que ainda não existe falharia ali.
      #
      # Era `continue-on-error: true` com `wrangler d1 migrations apply` direto.
      # O primeiro deploy real mostrou o custo disso: o passo vinha falhando com
      # `duplicate column name: access_type` em TODO deploy desde 09/08, e o
      # `continue-on-error` engolia a diferença entre "a coluna já estava lá" e
      # "o esquema não tem a coluna que o código escreve" — que é a diferença
      # entre irrelevante e grave. Ver scripts/d1-migrate.mjs.
      #
      # Agora são três desfechos, não dois:
      #   0   esquema no lugar          -> segue
      #   75  indeterminado (rede/API)  -> segue com aviso; entregar foto não
      #                                    pode depender do log de consentimento
      #   1   esquema QUEBRADO          -> PARA. Promover código que escreve numa
      #                                    tabela incompleta perde o registro de
      #                                    consentimento em silêncio, e ele é
      #                                    prova de autorização de uso de imagem.
      - name: Migrações D1
        id: migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          node scripts/d1-migrate.mjs fotos-consent migrations
          CODIGO=$?
          set -e
          case "$CODIGO" in
            0)
              echo "estado=ok" >> "$GITHUB_OUTPUT" ;;
            75)
              echo "estado=indeterminado" >> "$GITHUB_OUTPUT"
              echo "::warning::Não deu para confirmar o esquema do D1. O deploy segue — confira o log deste passo." ;;
            *)
              echo "estado=quebrado" >> "$GITHUB_OUTPUT"
              echo "::error::O esquema do D1 não está no estado que o código espera. Deploy interrompido antes de qualquer promoção."
              exit 1 ;;
          esac

      # ---------------------------------------------------------------------
      # Caminho de escape: deploy não-versionado (só migração de DO)
      # ---------------------------------------------------------------------
      - name: Deploy não-versionado (SEM portão de preview)
        id: unversioned
        if: inputs.unversioned
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          command: deploy --env=

      - name: Avisar que o portão foi pulado
        if: inputs.unversioned
        run: |
          {
            echo "### ⚠️ Deploy sem portão de preview"
            echo
            echo "Publicado direto em produção com \`wrangler deploy\`, o que só se"
            echo "justifica para aplicar migração de Durable Object (erro 10211)."
            echo "**O smoke rodou depois da publicação**, como no fluxo antigo."
          } >> "$GITHUB_STEP_SUMMARY"

      # ---------------------------------------------------------------------
      # Pré-requisito do portão: Preview URLs precisam estar LIGADAS
      # ---------------------------------------------------------------------
      # Isto foi o que derrubou a primeira execução real deste workflow. O
      # `versions upload` funcionou (versão 45e9e38c publicada), mas não
      # imprimiu URL de preview nenhuma, e o portão — corretamente — recusou
      # promover algo que não pôde verificar.
      #
      # O motivo está no código do wrangler. Ele só imprime a URL depois de
      # perguntar ao servidor (`GET .../subdomain`) se `previews_enabled` é
      # verdadeiro. E quem ESCREVE esse campo é `wrangler deploy` /
      # `triggers deploy`, nunca `versions upload` — é configuração
      # não-versionada. Com `preview_urls` ausente do wrangler.toml, o wrangler
      # manda `undefined` e o valor do servidor prevalece para sempre. Ou seja:
      # o Worker estava com Preview URLs desligadas e nada no repositório era
      # capaz de ligá-las.
      #
      # A chamada abaixo é a MESMA que o wrangler faz, feita direto para mexer
      # só nisto. `triggers deploy` também resolveria, mas reescreveria rotas e
      # crons a partir da configuração — e as rotas deste Worker moram no
      # painel, não no wrangler.toml (a mesma armadilha que o bloco
      # [observability] documenta). Trocar um deploy quebrado por um domínio
      # apagado não é conserto.
      - name: Garantir Preview URLs ligadas
        if: ${{ !inputs.unversioned && inputs.version_id == '' }}
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_CONTA: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -uo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/$CF_CONTA/workers/scripts/$WORKER_NAME/subdomain"
          CAB=(-H "Authorization: Bearer $CF_TOKEN"
               -H "Content-Type: application/json"
               -H "Cloudflare-Workers-Script-Api-Date: 2025-08-01")

          # `campo <chave> <json>` -> true | false | (vazio, se ausente/ilegível)
          campo() {
            node -e '
              let r; try { r = JSON.parse(process.argv[2]); } catch { console.log(""); process.exit(0); }
              const v = r && r.result ? r.result[process.argv[1]] : undefined;
              console.log(v === true ? "true" : v === false ? "false" : "");
            ' "$1" "$2"
          }

          ANTES=$(curl -s --max-time 20 "${CAB[@]}" "$API" || true)
          echo "antes:  $ANTES"

          # `enabled` (a rota workers.dev) é preservado como está. Este passo
          # tem uma responsabilidade só, e desligar workers.dev por descuido
          # derrubaria o alvo dos dois smokes.
          QUERO_ENABLED=true
          if [ "$(campo enabled "$ANTES")" = "false" ]; then QUERO_ENABLED=false; fi

          curl -s --max-time 20 -X POST "${CAB[@]}" \
            --data "{\"enabled\":$QUERO_ENABLED,\"previews_enabled\":true}" "$API" >/dev/null || true

          # Confere lendo o servidor de novo, e não a resposta do POST: o que
          # importa é o estado que o `versions upload` vai ler daqui a pouco.
          DEPOIS=$(curl -s --max-time 20 "${CAB[@]}" "$API" || true)
          echo "depois: $DEPOIS"
          if [ "$(campo previews_enabled "$DEPOIS")" != "true" ]; then
            echo "::error::Preview URLs continuam desligadas no Worker '$WORKER_NAME' — sem elas não há como verificar antes de promover."
            echo "::error::Ligue em Workers & Pages -> $WORKER_NAME -> Settings -> Domains & Routes -> Preview URLs, ou dê ao token do CI a permissão 'Workers Scripts: Edit'."
            exit 1
          fi
          echo "Preview URLs ligadas e confirmadas."

      # ---------------------------------------------------------------------
      # Caminho normal: sobe a versão SEM rotear tráfego
      # ---------------------------------------------------------------------
      # A versão é etiquetada com o SHA do commit. É o que permite achá-la
      # depois por `versions list --json` sem depender de parsear o stdout do
      # upload, e é o que faz "qual commit está em produção?" ter resposta na
      # própria Cloudflare, não só no Git.
      - name: Subir versão (sem tráfego)
        id: upload
        if: ${{ !inputs.unversioned && inputs.version_id == '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          SHORT_SHA="${GITHUB_SHA::7}"
          SAIDA=$(mktemp)
          if ! npx --yes wrangler@"$WRANGLER_VERSION" versions upload \
                 "$WRANGLER_ENV_FLAG" \
                 --tag "$SHORT_SHA" \
                 --message "$(git log -1 --pretty=%s | head -c 100)" 2>&1 | tee "$SAIDA"; then
            if grep -q '10211' "$SAIDA"; then
              echo "::error::Migração de Durable Object pendente: 'versions upload' não a aplica (10211)."
              echo "::error::Redispare este workflow manualmente com 'unversioned: true' — ele publica com 'wrangler deploy' e ABRE MÃO do portão de preview neste deploy."
            fi
            exit 1
          fi

          # A URL de preview é o portão inteiro. Se ela não vier, NÃO seguimos
          # em frente "sem testar" — isso reintroduziria exatamente o fluxo que
          # este workflow existe para eliminar.
          #
          # Ancorado no rótulo exato que o wrangler imprime
          # (`Version Preview URL: …`), com o formato da URL como reserva. A
          # regex solta de antes casava com QUALQUER endereço workers.dev na
          # saída — inclusive o da rota de produção, que teria feito o smoke
          # aprovar a versão errada e o portão passar a existir só no nome.
          #
          # E o `|| true` não é adorno: `grep` sem correspondência sai com 1, e
          # o runner roda este bloco com `bash -e` MAIS o `pipefail` acima.
          # Sem ele, a ausência da URL matava o step NA ATRIBUIÇÃO — foi por
          # isso que, na primeira execução real, o log trouxe só
          # "Process completed with exit code 1" e nenhuma das duas mensagens
          # abaixo, escritas justamente para este caso.
          PREVIEW=$(sed -n 's/^[[:space:]]*Version Preview URL:[[:space:]]*//p' "$SAIDA" | head -1 || true)
          if [ -z "$PREVIEW" ]; then
            PREVIEW=$(grep -oE 'https://[0-9a-f]{8}-[a-z0-9-]+\.[a-z0-9-]+\.workers\.dev' "$SAIDA" | head -1 || true)
          fi
          if [ -z "$PREVIEW" ]; then
            echo "::error::O upload funcionou, mas não veio URL de preview — então não há o que verificar, e não promovemos."
            echo "::error::O passo 'Garantir Preview URLs ligadas' deveria ter resolvido isto. Se ele passou e a URL ainda não vem, o Worker pode não suportar preview (metadata.has_preview) — confira em Settings → Domains & Routes."
            exit 1
          fi
          echo "Preview: $PREVIEW"
          echo "preview_url=$PREVIEW" >> "$GITHUB_OUTPUT"
          echo "version_tag=$SHORT_SHA" >> "$GITHUB_OUTPUT"

          # O ID da versão sai do próprio upload — é a linha `Worker Version ID:`
          # que o wrangler imprime logo depois de `Uploaded fotos`, confirmada na
          # saída real do run #135. É o MESMO identificador que
          # `versions deploy <id>@100` aceita.
          #
          # Vale mais que procurá-lo depois por etiqueta: aqui não há dúvida de
          # QUAL versão é — é a que este step acabou de subir, não uma que casou
          # com um filtro. A busca por etiqueta continua existindo no passo
          # seguinte, como reserva.
          ID=$(sed -n 's/^[[:space:]]*Worker Version ID:[[:space:]]*//p' "$SAIDA" | head -1 | tr -d '[:space:]' || true)
          # UUID conferido por inteiro, e não por "parece um UUID": este valor
          # vai direto para `versions deploy <id>@100`. Se não casar, o passo
          # seguinte tenta pela etiqueta em vez de promover um lixo qualquer.
          if printf '%s' "$ID" | grep -qE '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'; then
            echo "version_id=$ID" >> "$GITHUB_OUTPUT"
            echo "Versão: $ID"
          else
            echo "A linha 'Worker Version ID' não trouxe um UUID (veio: '$ID'). O passo seguinte resolve pela etiqueta."
          fi

      # Resolve a etiqueta para o ID pela API, e não por regex no stdout: o ID
      # é o que `versions deploy` aceita, e `versions list --json` é contrato
      # estável (`--json` é flag documentada), diferente do texto do upload.
      - name: Resolver o ID da versão
        id: resolve
        if: ${{ !inputs.unversioned }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -eo pipefail
          if [ -n "${{ inputs.version_id }}" ]; then
            echo "version_id=${{ inputs.version_id }}" >> "$GITHUB_OUTPUT"
            echo "Promovendo versão informada à mão (rollback): ${{ inputs.version_id }}"
            exit 0
          fi
          # Caminho normal: o upload já disse qual é o ID. Nada a resolver.
          if [ -n "${{ steps.upload.outputs.version_id }}" ]; then
            echo "version_id=${{ steps.upload.outputs.version_id }}" >> "$GITHUB_OUTPUT"
            echo "ID veio do próprio upload: ${{ steps.upload.outputs.version_id }}"
            exit 0
          fi
          # Reserva: o wrangler mudou o texto do upload. Procura pela etiqueta.
          TAG="${{ steps.upload.outputs.version_tag }}"
          npx --yes wrangler@"$WRANGLER_VERSION" versions list "$WRANGLER_ENV_FLAG" --json > versoes.json
          # A etiqueta aparece em `annotations["workers/tag"]` na API atual, mas
          # este é o único ponto do workflow que depende de um FORMATO de
          # resposta, e não de um flag documentado. Então: tenta as formas
          # conhecidas e, se nenhuma casar, MORRE mostrando o que veio — nunca
          # cai para "a mais recente", que promoveria uma versão que ninguém
          # verificou e desfaria o portão inteiro em silêncio.
          ID=$(node -e '
            const v = require("./versoes.json");
            const alvo = process.argv[1];
            const lista = Array.isArray(v) ? v : (v && Array.isArray(v.versions) ? v.versions : []);
            const etiqueta = x => (x && x.annotations && x.annotations["workers/tag"]) || (x && x.tag) || null;
            const achada = lista.find(x => etiqueta(x) === alvo);
            if (achada && achada.id) { console.log(achada.id); process.exit(0); }
            console.error("Nenhuma versão com a etiqueta " + JSON.stringify(alvo) + ".");
            console.error("Etiquetas vistas: " + JSON.stringify(lista.slice(0, 5).map(etiqueta)));
            console.error("Chaves do primeiro item: " + JSON.stringify(Object.keys(lista[0] || {})));
            process.exit(1);' "$TAG")
          if [ -z "$ID" ]; then
            echo "::error::Não consegui resolver o ID da versão recém-enviada — veja as chaves impressas acima e ajuste o resolvedor."
            exit 1
          fi
          echo "version_id=$ID" >> "$GITHUB_OUTPUT"
          echo "Versão $ID etiquetada como $TAG"

      # ---------------------------------------------------------------------
      # O PORTÃO: smoke contra o preview, antes de qualquer tráfego
      # ---------------------------------------------------------------------
      - name: Smoke do PREVIEW (antes de qualquer cliente)
        if: ${{ !inputs.unversioned && inputs.version_id == '' }}
        run: |
          echo "### 🔎 Smoke do preview" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${{ steps.upload.outputs.preview_url }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          bash scripts/smoke.sh "${{ steps.upload.outputs.preview_url }}" \
            --expect-configured --summary "$GITHUB_STEP_SUMMARY"

      # ---------------------------------------------------------------------
      # Promoção: 100% do tráfego para a MESMA versão que passou no smoke
      # ---------------------------------------------------------------------
      - name: Promover para produção
        id: promote
        if: ${{ !inputs.unversioned && (github.event_name == 'push' || inputs.promote) }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -eo pipefail
          ID="${{ steps.resolve.outputs.version_id }}"
          npx --yes wrangler@"$WRANGLER_VERSION" versions deploy "$ID@100" \
            "$WRANGLER_ENV_FLAG" --yes \
            --message "CI $GITHUB_RUN_ID — $(git log -1 --pretty=%s | head -c 80)"
          echo "promoted=true" >> "$GITHUB_OUTPUT"

      # `sleep 20` era um chute: curto demais numa propagação lenta (falso
      # vermelho) e desperdício quando já estava pronto. Isto espera pelo SINAL,
      # e o número de tentativas fica registrado.
      - name: Esperar a propagação (por sinal, não por relógio)
        id: readiness
        if: ${{ steps.promote.outputs.promoted == 'true' || inputs.unversioned }}
        run: |
          BASE="https://${WORKER_NAME}.lucafchala.workers.dev"
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$BASE/api/healthz" || true)
            if [ "$CODE" = "200" ]; then
              echo "pronto após ${i} tentativa(s)"
              echo "tentativas=$i" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 2
          done
          echo "::error::healthz não respondeu 200 em ~60s após a promoção"
          exit 1

      - name: Smoke de PRODUÇÃO (confirma a promoção)
        if: ${{ steps.promote.outputs.promoted == 'true' || inputs.unversioned }}
        run: |
          echo "### ✅ Smoke de produção" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          # workers.dev e não o domínio de produção: a zona fotos.lucafchala.com
          # fica atrás do bot mitigation da Cloudflare, que responde 403 a
          # cliente não-browser como o curl. É o MESMO Worker.
          bash scripts/smoke.sh "https://${WORKER_NAME}.lucafchala.workers.dev" \
            --expect-configured --summary "$GITHUB_STEP_SUMMARY"

      # ---------------------------------------------------------------------
      # Rastreabilidade: a tag deixa de ser ação manual
      # ---------------------------------------------------------------------
      # O TODO.md pedia "marcar releases com tag para que rollback seja um SHA
      # conhecido em vez de arqueologia no log", e o repositório não tinha
      # nenhuma — porque dependia de alguém lembrar. Agora é consequência
      # automática de um deploy que passou nos dois smokes.
      - name: Marcar o release
        if: ${{ steps.promote.outputs.promoted == 'true' && github.event_name == 'push' }}
        run: |
          set -e
          TAG="deploy-$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Deploy verificado — versão ${{ steps.resolve.outputs.version_id }}"
          git push origin "$TAG"
          echo "TAG_CRIADA=$TAG" >> "$GITHUB_ENV"

      # ---------------------------------------------------------------------
      # Observabilidade: o resumo responde "o que foi para produção, e passou?"
      # sem abrir log de step nenhum.
      # ---------------------------------------------------------------------
      - name: Resumo do deploy
        if: always()
        run: |
          {
            echo "## Deploy"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Commit | \`${GITHUB_SHA::7}\` — $(git log -1 --pretty=%s | head -c 70) |"
            echo "| Disparo | \`${{ github.event_name }}\` |"
            echo "| Wrangler | \`${WRANGLER_VERSION:-?}\` |"
            echo "| Versão | \`${{ steps.resolve.outputs.version_id || '—' }}\` |"
            echo "| Preview | ${{ steps.upload.outputs.preview_url || '—' }} |"
            echo "| Promovido | ${{ steps.promote.outputs.promoted == 'true' && '✅ 100% do tráfego' || '⏸️ não (só preview)' }} |"
            echo "| Propagação | ${{ steps.readiness.outputs.tentativas && format('{0} tentativa(s)', steps.readiness.outputs.tentativas) || '—' }} |"
            echo "| Migrações D1 | ${{ steps.migrations.outputs.estado == 'ok' && '✅ esquema no lugar' || (steps.migrations.outputs.estado == 'indeterminado' && '⚠️ indeterminado (deploy seguiu)' || '❌ esquema quebrado') }} |"
            echo "| Tag | \`${TAG_CRIADA:-—}\` |"
            echo
            if [ "${{ steps.promote.outputs.promoted }}" != "true" ] && [ "${{ inputs.unversioned }}" != "true" ]; then
              echo "> A versão foi publicada e verificada, mas **não** recebeu tráfego."
              echo "> Para promovê-la: rode este workflow com \`version_id\` = \`${{ steps.resolve.outputs.version_id }}\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
