name: Deploy

on:
  push:
    branches: [main]

# Uma única fonte da verdade para a versão do wrangler usada nos dois steps que
# falam com a Cloudflare (migrations D1 e deploy). Tem que acompanhar a major do
# devDependency em package.json — se divergir, a produção roda numa versão que
# nenhum teste exercitou.
env:
  WRANGLER_VERSION: '4.114.0'

# Menor privilégio: o deploy fala com a Cloudflare por API token próprio
# (secret), não pelo token do GitHub — que aqui só precisa ler o código.
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pre-deploy gate: run the unit suite before touching production. A red
      # test aborts the job before the migration / deploy steps run.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # 22+ é exigido pelo wrangler 4 (engines: node >=22). No Node 20 o
          # binário recusa a rodar antes de qualquer comando — foi o que
          # derrubou o deploy de 6fb8d1c, quando o pin explícito da versão
          # passou a instalar o wrangler 4 no lugar do v3.90 default da action.
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Unit tests
        run: npm test

      # Apply pending D1 migrations before deploying, so the new columns exist when
      # the new code starts writing. Pinned because the action's default (v3.90) is
      # rejected by the D1 API as out-of-date. continue-on-error so a migration
      # hiccup (e.g. token missing D1 Edit scope) never blocks the deploy itself —
      # the consent INSERT is best-effort and degrades safely.
      # Idempotent: wrangler skips migrations already recorded in d1_migrations.
      - name: Apply D1 migrations
        continue-on-error: true
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          command: d1 migrations apply fotos-consent --remote

      # wranglerVersion explícito: sem ele a action cai no default v3.90, ou seja,
      # o deploy rodaria numa major diferente da que o dev e os testes usam
      # (package.json exige ^4). Mantenha este valor em sintonia com o
      # devDependency do wrangler ao atualizá-lo.
      - name: Deploy to Cloudflare Workers
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}

      - name: Wait for global propagation
        run: sleep 20

      - name: Smoke tests
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -e
          # Smoke-test the workers.dev deployment URL, NOT the custom domain.
          # The production zone (fotos.lucafchala.com) sits behind Cloudflare bot
          # mitigation, which answers non-browser clients like curl with HTTP 403
          # — that is why every prior deploy's smoke tests failed on the first
          # check. The workers.dev route runs the same Worker without that edge
          # challenge. Fall back to the known URL if the action output is empty.
          BASE="${DEPLOYMENT_URL:-https://fotos.lucafchala.workers.dev}"
          echo "Smoke-testing $BASE"

          check_status() {
            local label=$1 url=$2 expected=$3
            local shift=3; shift $shift
            local actual
            actual=$(curl -s -o /dev/null -w "%{http_code}" "$@" "$url")
            if [ "$actual" != "$expected" ]; then
              echo "FAIL [$label]: expected HTTP $expected, got $actual"
              exit 1
            fi
            echo "OK   [$label]: $actual"
          }

          # Core pages
          check_status "gallery"   "$BASE/"             200
          check_status "dashboard" "$BASE/dashboard"    200
          check_status "manifest"  "$BASE/manifest.json" 200
          check_status "icon"      "$BASE/icon.svg"     200
          check_status "404"       "$BASE/__no_such_route__" 404

          # Static public pages — each is its own template literal (src/ui/*.js)
          # with no shared render path, so a broken one doesn't 500 the others.
          check_status "about"     "$BASE/sobre"        200
          check_status "gear"      "$BASE/equipamentos"  200
          check_status "terms"     "$BASE/termos"        200
          check_status "privacy"   "$BASE/privacidade"   200
          check_status "support"   "$BASE/suporte"       200
          check_status "legal"     "$BASE/legal"         200
          check_status "compliance" "$BASE/compliance"   200

          # SEO/security discovery endpoints — machine-readable, but a 500 here
          # means a crawler or the security.txt RFC 9116 contact silently breaks.
          check_status "sitemap"        "$BASE/sitemap.xml"                200
          check_status "robots"         "$BASE/robots.txt"                 200
          check_status "llms"           "$BASE/llms.txt"                   200
          check_status "security.txt"   "$BASE/.well-known/security.txt"   200
          check_status "gpc.json"       "$BASE/.well-known/gpc.json"       200

          # Health check: verifies KV is reachable and PBKDF2 completes
          # within the Workers CPU budget. A CPU timeout returns 5xx, failing this step.
          HEALTH=$(curl -sf "$BASE/api/healthz")
          echo "Health response: $HEALTH"
          echo "$HEALTH" | grep -q '"ok":true' || { echo "FAIL [healthz]: unexpected response"; exit 1; }

          HASH_MS=$(echo "$HEALTH" | grep -o '"hashMs":[0-9]*' | cut -d: -f2)
          echo "OK   [healthz]: hashing took ${HASH_MS}ms"
          if [ -n "$HASH_MS" ] && [ "$HASH_MS" -gt 200 ]; then
            echo "FAIL [healthz]: hashing took ${HASH_MS}ms — too slow, login will timeout"
            exit 1
          fi

          # Functional self-test (broken Drive links, missing form secrets, etc.)
          # is data/config, not a code regression from this deploy — log it, but
          # never fail the build over an unrelated event being misconfigured.
          if ! echo "$HEALTH" | grep -q '"problems":\[\]'; then
            echo "NOTE [healthz selftest]: non-empty problem list — check /dashboard or /api/healthz"
          fi

          # Login endpoint: wrong password must redirect (302), never crash (5xx).
          # A CPU timeout during hashing returns 5xx and fails this check.
          check_status "login" "$BASE/dashboard/login" 302 \
            -X POST \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "password=smoke-check-wrong"

          # --- Cabeçalhos de segurança -------------------------------------
          # Um cabeçalho que some não quebra tela nenhuma: o site continua
          # respondendo 200 e ninguém percebe até um incidente. Por isso os
          # controles críticos são verificados na resposta REAL de produção, e
          # não só nos testes unitários que exercitam o construtor deles.
          echo ""
          echo "Verificando cabeçalhos de segurança…"
          HEADERS=$(curl -sI "$BASE/")

          require_header() {
            local label=$1 pattern=$2
            if ! echo "$HEADERS" | grep -iqE "$pattern"; then
              echo "FAIL [header $label]: ausente ou inesperado"
              echo "$HEADERS"
              exit 1
            fi
            echo "OK   [header $label]"
          }

          require_header "X-Content-Type-Options"    '^x-content-type-options: *nosniff'
          require_header "X-Frame-Options"           '^x-frame-options: *DENY'
          require_header "Strict-Transport-Security" '^strict-transport-security: *max-age=[0-9]+'
          require_header "Content-Security-Policy"   "^content-security-policy:.*frame-ancestors 'none'"
          require_header "CSP report-only (estrita)" '^content-security-policy-report-only:'
          require_header "CSP nonce (na estrita)"    "^content-security-policy-report-only:.*'nonce-"

          # O enforced NÃO pode carregar nonce enquanto houver handler inline:
          # pela CSP Level 3 o nonce descarta o 'unsafe-inline', e a interface
          # inteira para de responder. Já aconteceu — este check existe por isso.
          if curl -sI "$BASE/" | grep -i '^content-security-policy:' | grep -q "nonce-"; then
            echo "FAIL [CSP]: nonce na política ENFORCED — isso desativa o 'unsafe-inline' e quebra os handlers inline"
            exit 1
          fi
          echo "OK   [CSP]: enforced sem nonce, handlers inline preservados"
          require_header "Permissions-Policy"        '^permissions-policy:.*camera=\(\)'
          require_header "COOP"                      '^cross-origin-opener-policy: *same-origin'
          require_header "Origin-Agent-Cluster"      '^origin-agent-cluster:'

          # O nonce do cabeçalho tem que aparecer na marcação: um nonce que não
          # bate é o mesmo que não ter nonce.
          NONCE=$(echo "$HEADERS" | grep -i '^content-security-policy-report-only:' | grep -io "'nonce-[A-Za-z0-9_-]*'" | head -1 | tr -d "'" | sed 's/nonce-//')
          if [ -z "$NONCE" ]; then echo "FAIL [nonce]: não encontrado no cabeçalho"; exit 1; fi
          if ! curl -s "$BASE/" | grep -q "nonce=\"$NONCE\""; then
            echo "FAIL [nonce]: o nonce do cabeçalho não aparece no HTML"
            exit 1
          fi
          echo "OK   [nonce]: cabeçalho e marcação batem"

          # Dados pessoais não podem encostar em cache. /api/healthz é o
          # representante das respostas de dados nesta checagem.
          if ! curl -sI "$BASE/api/healthz" | grep -iqE '^cache-control:.*no-store'; then
            echo "FAIL [no-store]: resposta de API sem no-store"
            exit 1
          fi
          echo "OK   [no-store]: respostas de API não são cacheáveis"

          # CSRF: uma escrita cross-site tem que morrer antes de qualquer
          # handler. Esta é a checagem mais importante da lista — ela falha
          # aberto se o portão for removido num refactor.
          check_status "csrf cross-site" "$BASE/api/events" 403 \
            -X POST \
            -H "Content-Type: application/json" \
            -H "Sec-Fetch-Site: cross-site" \
            -d '{}'

          echo ""
          echo "All smoke tests passed."
