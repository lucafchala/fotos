name = "fotos"
main = "src/index.js"
compatibility_date = "2024-11-01"
account_id = "e5869d6881e992cf4681ce85583a6ab2"

# Secrets (definidos por `npx wrangler secret put <NOME>`, nunca aqui):
#
#   ADMIN_PASSWORD        senha inicial do painel; semeia o hash em KV no
#                         primeiro acesso e depois pode ser trocada pelo painel
#   TURNSTILE_SECRET_KEY  verificação anti-robô; a ausência faz TODOS os
#                         formulários recusarem envio (fail closed, proposital)
#   RESEND_API_KEY        e-mails transacionais e alertas
#   ADMIN_EMAIL           destinatário dos alertas e das notificações
#   SIGNING_SECRET        assina o nonce de página do /api/drive-link e o token
#                         dos formulários públicos (HMAC-SHA256, sem estado)
#   CF_ANALYTICS_TOKEN    token da Web Analytics (opcional)
#
# ATENÇÃO ao SIGNING_SECRET: diferente dos outros, a ausência dele NÃO quebra
# nada — os dois controles simplesmente não são exigidos, e o site segue
# funcionando como se estivesse protegido. Foi uma escolha consciente (um
# segredo faltando é erro de deploy, e recusar tudo derrubaria a entrega das
# fotos por causa de uma camada adicional), com o contrapeso de nunca ser
# silenciosa: `auditSite()` acusa a falta, ela aparece em /api/healthz e no
# painel de status até alguém rodar `npx wrangler secret put SIGNING_SECRET`.
# Ver a justificativa completa em signingSecret(), src/index.js.

[[kv_namespaces]]
binding = "FOTOS"
id = "4d2c399e77804f3a82b66e4ec0a7fa5e"

# Image-use consent audit log (Part 5). Each acceptance of the Terms before Drive
# access is recorded here (schema in migrations/0001_consent.sql). Removing this
# binding makes env.CONSENT_DB undefined and consent logging a safe no-op.
[[d1_databases]]
binding = "CONSENT_DB"
database_name = "fotos-consent"
database_id = "d6bed362-4ddf-459d-a088-48b42aa11fdc"
migrations_dir = "migrations"

# ---------------------------------------------------------------------------
# Contadores e rate limit (Durable Objects)
# ---------------------------------------------------------------------------
# Trocaram o KV porque ele não tem incremento atômico e recusa mais de uma
# escrita por segundo na MESMA chave — limite que o plano pago também não sobe.
# O raciocínio completo está em src/counters.js.
#
# `new_sqlite_classes`, e não `new_classes`: no plano gratuito só existe o
# backend SQLite. Declarar como key-value faria o deploy falhar na conta.
# A tag da migração é histórico append-only — não reaproveite `v1` para outra
# mudança; acrescente `v2`.
#
# ⚠️ MIGRAÇÃO DE DURABLE OBJECT NÃO SOBE POR `wrangler versions upload`.
#
# A API recusa com o código 10211: "migrations must be fully applied via a
# non-versioned deployment". Ou seja, quem cria a classe é `wrangler deploy`
# (não-versionado) — que é o que o .github/workflows/deploy.yml roda no push
# para a main.
#
# Isso importa porque o Cloudflare Workers Builds (configurado no PAINEL, não
# neste repositório) roda `npx wrangler versions upload` a cada PR. Enquanto a
# migração nova não tiver sido aplicada por um deploy de verdade, esse build
# FALHA — e a falha é esperada, não é sinal de código quebrado.
#
# A ordem que funciona, e que vale para toda migração futura (v2, v3…):
#   1. merge → deploy.yml roda `wrangler deploy` → a migração é aplicada;
#   2. a partir daí os previews de PR voltam a passar sozinhos.
#
# Não existe atalho: migração e código sobem juntos, não dá para aplicar só a
# migração antes.
[[durable_objects.bindings]]
name = "COUNTER"
class_name = "Counter"

[[durable_objects.bindings]]
name = "RATELIMIT"
class_name = "RateLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Counter", "RateLimiter"]

[triggers]
# Daily 03:00 UTC — purge resolved removal requests + expired consent rows.
crons = ["0 3 * * *"]

# ---------------------------------------------------------------------------
# Observabilidade
# ---------------------------------------------------------------------------
# ESTE BLOCO PRECISA EXISTIR AQUI, e não só no painel da Cloudflare.
#
# O `wrangler deploy` trata a configuração como fonte da verdade e desliga o
# que não está declarada. Do próprio código do wrangler (`patchNonVersioned
# ScriptSettings`):
#
#     // If the user hasn't specified observability assume that they want it
#     // disabled if they have it on. [...] will remove observability if it has
#     // been removed from their Wrangler configuration file
#     observability: worker.observability ?? { enabled: false },
#
# Ou seja: sem este bloco, todo push na `main` apagava silenciosamente o que
# tivesse sido ligado no painel. O log voltaria a sumir sem ninguém mexer em
# nada — e a descoberta viria no meio de um incidente, que é justamente quando
# não dá para reconstruir o histórico.
#
# Sobre `enabled = false` no topo com `logs`/`traces` ligados: não é
# contradição. O wrangler resolve o aninhado com precedência sobre o de cima —
#
#     logs_enabled: observability?.logs?.enabled ?? observability?.enabled === true
#
# — então `logs.enabled = true` vale mesmo com o topo em `false`. É a
# configuração que está no painel hoje, reproduzida aqui tal como está para o
# deploy parar de brigar com ela.
[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true

[env.preview]
name = "fotos-preview"

[[env.preview.kv_namespaces]]
binding = "FOTOS"
id = "4d2c399e77804f3a82b66e4ec0a7fa5e"

# O preview precisa dos mesmos bindings: um ambiente sem eles quebra em
# `env.COUNTER is undefined` no primeiro visitante, e não no deploy.
[[env.preview.durable_objects.bindings]]
name = "COUNTER"
class_name = "Counter"

[[env.preview.durable_objects.bindings]]
name = "RATELIMIT"
class_name = "RateLimiter"

[[env.preview.migrations]]
tag = "v1"
new_sqlite_classes = ["Counter", "RateLimiter"]
